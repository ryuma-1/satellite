name: ✨ 機能要望
description: 新機能の追加や既存機能の改善を提案する
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        機能要望のご提案ありがとうございます。
        背景や目的も併せて記載していただけると、検討がしやすくなります。

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: どのような機能を追加・改善したいのか、一言で分かるように説明してください
      placeholder: 例）検索画面に絞り込みフィルタを追加したい
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景・課題
      description: なぜこの機能が必要なのか、現状どのような課題があるのかを記載してください
      placeholder: 例）現状は一覧が長くなると目的のデータを探しにくい
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する結果
      description: この機能によってどのような状態になってほしいかを記載してください
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 実現方法の案（任意）
      description: 実装のアイデアや参考にしたい他サービスの例があれば記載してください
    validations:
      required: false

  - type: textarea
    id: screenshots-logs
    attributes:
      label: 参考情報（スクリーンショット・ログなど）
      description: 参考になる資料やログがあれば添付してください
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 備考・関連Issue/PR
      description: 関連するIssueやPRへのリンク、補足情報があれば記載してください
    validations:
      required: false
